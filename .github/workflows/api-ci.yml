name: API and mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://cosmedia:cosmedia@localhost:55432/cosmedia
      ADMIN_API_KEY: ci-admin-key-with-at-least-32-characters
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cosmedia
          POSTGRES_USER: cosmedia
          POSTGRES_PASSWORD: cosmedia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cosmedia -d cosmedia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:check
      - run: npm run mobile:test
      - run: npm run mobile:export
